<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Question Generator</title>
  <meta name="description"
    content="Generate tailored interview questions for any job role using AI, powered by Google Gemini." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!--
      Inline theme init: reads localStorage before the page renders
      to avoid a flash of the wrong theme.
    -->
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>

<body>
  <!-- Theme toggle (fixed, top-right) -->
  <button id="theme-toggle" type="button" aria-label="Toggle dark/light mode" title="Toggle dark/light mode">
    <!-- Moon icon (shown in dark mode) -->
    <svg id="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <!-- Sun icon (shown in light mode) -->
    <svg id="icon-sun" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
  </button>
  <!-- ══════════════════════════════════════════
         MAIN CONTAINER
    ══════════════════════════════════════════ -->
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="header__badge">
        <span></span> Powered by Melo Associates
      </div>
      <h1>Interview Question Generator</h1>
      <p>
        Enter any job title and instantly get three tailored, professional
        interview questions generated by Google Gemini.
      </p>
    </header>

    <!-- Input card -->
    <section class="input-card" aria-label="Job title input">
      <div class="input-group">
        <label class="input-label" for="job-title-input">Job Title</label>

        <div class="input-row">
          <input id="job-title-input" type="text" placeholder="e.g. Customer Success Manager" autocomplete="off"
            aria-label="Job title" maxlength="100" />

          <button id="submit-btn" type="button" aria-live="polite">
            Generate Questions
          </button>
        </div>

        <!-- Inline error message (hidden until needed) -->
        <div id="error-message" role="alert" aria-live="assertive"></div>
      </div>
    </section>

    <!-- Results area (hidden until questions are returned) -->
    <section id="results-section" aria-label="Generated questions" aria-live="polite">
      <div class="results-header">
        <h2>Questions for</h2>
        <span id="results-role-tag" class="role-tag"></span>
      </div>
      <div id="questions-list"></div>
    </section>

  </div>

  <!-- Footer -->
  <footer class="footer">
    Built with
    <a href="https://console.groq.com" target="_blank" rel="noopener">Groq</a>
    · Interview Question Generator
  </footer>

  <!-- ══════════════════════════════════════════
         SCRIPTS
         config.js must load before app.js so that
         the CONFIG object is available globally.
    ══════════════════════════════════════════ -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
